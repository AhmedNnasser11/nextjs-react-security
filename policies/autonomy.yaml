version: '1.0'
levels:
  READ_ONLY:
    default: true
    examples: [repository_inspection, advisory_lookup, web_research, tests, build, lint]
  AUTO_FIX_SAFE:
    requires:
      - confirmed_finding
      - reversible_change
      - minimal_diff
      - no_security_boundary_redesign
      - sandboxed_execution
      - verification_plan
      - rollback_available
    examples:
      - dependency_patch_update
      - paired_lockfile_update
      - regression_test_addition
  APPROVAL_REQUIRED:
    examples:
      - security_headers
      - csp
      - input_validation
      - server_action_authorization
      - ssrf_protection
      - xss_sanitization
      - cors
      - authentication_code
      - session_code
      - application_config
  NEVER_AUTOMATE:
    examples:
      - secrets_access_or_rotation
      - IAM_or_permissions
      - database_schema_changes
      - production_infrastructure_changes
      - direct_main_branch_commit
      - destructive_operations
      - architectural_rewrites
